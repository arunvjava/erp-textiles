<div class="row table-container mat-elevation-z8">
    @if (isLoadingResults) {
    <div class="spinner-loading-shade">
        @if (isLoadingResults) {
        <mat-spinner class="spinner"></mat-spinner>
        }
    </div>
    }
    <div class="col-4">
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Name" #input>
        </mat-form-field>
    </div>
    <div class="mat-table-container">
        <table mat-table [dataSource]="dataSource" matSort matSortActive="id" matSortDisableClear
            matSortDirection="asc">
            <!-- Checkbox Column -->
            <!-- <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef class="col-1">
                    <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </td>
            </ng-container> -->

            <!-- Dynamic column definitions -->
            <ng-container *ngFor="let column of displayedColumns; let i = index" [matColumnDef]="column">
                @if (column === 'select') {
                <th mat-header-cell *matHeaderCellDef class="col-1">
                    <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </td>
                } @else {
                <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ columnMap.get(column) }} </th>
                <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
                }

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,50]" showFirstLastButtons></mat-paginator>
</div>
